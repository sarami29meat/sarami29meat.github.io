<body>

<nav>
  <div class="nav-inner">
    <a class="nav-logo" href="index.html">sarami<em>_</em></a>
    <ul class="nav-links">
      <li><a href="index.html">home</a></li>

    </ul>
    <div class="nav-burger"><span></span><span></span><span></span></div>
  </div>
</nav>

<main>
  <div class="wrap">
    <div class="post-hd">
      <p class="post-hd-label">// contact</p>
      <h1>連絡とサポート</h1>
      <p style="color:var(--muted);font-size:14px;margin-top:10px;">バグ報告・要望・感想、なんでも。</p>
    </div>

    <div class="contact-grid sec" style="padding-top:0;border-top:none;">

      <div class="contact-box">
        <p class="contact-box-title">メッセージ</p>
        <p class="contact-box-sub">動かない・こんな機能ほしい・ただの感想、なんでも歓迎です。</p>
        <form id="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
          <div class="field">
            <label>名前（任意）</label>
            <input type="text" name="name" placeholder="your name">
          </div>
          <div class="field">
            <label>メール *</label>
            <input type="email" name="email" required placeholder="you@example.com">
          </div>
          <div class="field">
            <label>メッセージ *</label>
            <textarea name="message" required placeholder="なんでも書いてください"></textarea>
          </div>
          <button type="submit" class="btn-send">送信</button>
        </form>
      </div>

      <div class="contact-box donate-box">
        <div class="donate-icon">☕</div>
        <p class="donate-title">開発を支援する</p>
        <p class="donate-sub">
          全部無料で使えます。<br>
          それでも「役に立った」と思ったら、コーヒー1杯分だけ投げてもらえると次への燃料になります。
        </p>
        <a class="bmc-btn" href="https://www.buymeacoffee.com/sarami2929" target="_blank">
          ☕ Buy me a coffee
        </a>
      </div>

    </div>
  </div>
</main>

</html>
