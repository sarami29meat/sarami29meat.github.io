<main>
  <div class="wrap">
    <div class="page-hd">
      <h1 data-i18n="contact-page-title">お問い合わせ</h1>
      <p class="page-hd-sub" data-i18n="contact-page-sub">バグ・要望・感想、なんでもどうぞ。</p>
    </div>

    <div class="contact-grid">
      <div class="contact-box">
        <p class="contact-box-title" data-i18n="contact-form-title">メッセージ</p>
        <p class="contact-box-sub" data-i18n="contact-form-sub">動かない、こんな機能がほしい、使ってみた感想など気軽にどうぞ。</p>
        <form id="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
          <div class="field">
            <label data-i18n="contact-name-label">名前（任意）</label>
            <input type="text" name="name" data-i18n-ph="contact-name-label" placeholder="お名前">
          </div>
          <div class="field">
            <label data-i18n="contact-email-label">メールアドレス ＊</label>
            <input type="email" name="email" required placeholder="you@example.com">
          </div>
          <div class="field">
            <label data-i18n="contact-msg-label">メッセージ ＊</label>
            <textarea name="message" required placeholder="..."></textarea>
          </div>
          <button type="submit" class="btn-yellow" style="width:100%;justify-content:center;" data-i18n="contact-submit">送信する</button>
        </form>
      </div>

      <div class="contact-box donate-box">
        <div class="donate-icon">☕</div>
        <p class="donate-title" data-i18n="donate-title">開発を支援する</p>
        <p class="donate-sub" data-i18n="donate-sub">気に入ったツールがあれば、コーヒー1杯分だけ投げてもらえると次の開発の励みになります。</p>
        <a class="bmc-btn" href="https://www.buymeacoffee.com/sarami2929" target="_blank">☕ Buy me a coffee</a>
      </div>
    </div>
  </div>
